global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'vectordb-engine'
    static_configs:
      - targets: ['vectordb-engine:8080']
    metrics_path: '/metrics'

  - job_name: 'vectordb-api'
    static_configs:
      - targets: ['api-server:3000']
    metrics_path: '/metrics'
